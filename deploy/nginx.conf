# /etc/nginx/sites-available/crm  (substitua crm.seudominio.com.br)
upstream crm_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name crm.seudominio.com.br;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name crm.seudominio.com.br;

  # certificados emitidos pelo certbot
  ssl_certificate     /etc/letsencrypt/live/crm.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crm.seudominio.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 25m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # tempo real (Server-Sent Events): sem buffer e com timeout longo
  location /api/events {
    proxy_pass http://crm_api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://crm_api;
    proxy_read_timeout 120s;
  }
}
