# Publicação de TESTE no Render (render.com) — Blueprint: banco PostgreSQL + aplicação
# No Render: New > Blueprint > selecione este repositório/branch. Defina ADMIN_EMAIL e ADMIN_PASSWORD quando pedido.
databases:
  - name: crm-db
    plan: free
    databaseName: crm
    user: crm
    postgresMajorVersion: "16"

services:
  - type: web
    name: crm-microfacil
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
